# Despliegue en Render (Blueprint). El backend es ligero: sin base de datos ni pipeline.
# Obligatorias en producción:
#   DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS
# CORS_ALLOWED_ORIGINS debe ser el origen exacto del dashboard (sin barra final).
services:
  - type: web
    name: cebadata-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn cebadata.wsgi:application --preload --workers 1 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/salud
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
